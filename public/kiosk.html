<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Room Display Screen - จอหน้าห้องประชุม</title>
  <style>
    :root {
      --free-bg: #064e3b;
      --free-card: #047857;
      --free-accent: #34d399;
      --busy-bg: #7f1d1d;
      --busy-card: #b91c1c;
      --busy-accent: #f87171;
      --dark-bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.08);
      --border-color: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
      background: var(--dark-bg);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      transition: background 0.5s ease;
    }
    body.is-free { background: radial-gradient(circle at top right, #065f46 0%, #064e3b 40%, #022c22 100%); }
    body.is-busy { background: radial-gradient(circle at top right, #991b1b 0%, #7f1d1d 40%, #450a0a 100%); }

    /* Top Bar */
    .kiosk-header {
      padding: 24px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border-color);
    }
    .room-title-area h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .room-meta {
      font-size: 16px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .clock-area {
      text-align: right;
    }
    .clock-time {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }
    .clock-date {
      font-size: 15px;
      opacity: 0.85;
    }

    /* Main Area */
    .kiosk-main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      padding: 36px;
      gap: 32px;
      align-items: center;
    }

    /* Left Side: Big Status Hero */
    .status-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      height: 100%;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 36px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-block;
    }
    .is-free .status-dot { background: var(--free-accent); box-shadow: 0 0 20px var(--free-accent); }
    .is-busy .status-dot { background: var(--busy-accent); box-shadow: 0 0 20px var(--busy-accent); }

    .current-topic {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .current-host {
      font-size: 18px;
      opacity: 0.9;
      line-height: 1.6;
    }
    .current-timer {
      margin-top: 24px;
      font-size: 20px;
      font-weight: 700;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      display: inline-block;
    }

    /* Quick Actions */
    .quick-actions {
      margin-top: 28px;
    }
    .quick-title {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
      margin-bottom: 12px;
    }
    .quick-btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-quick {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quick:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Right Side: Next Schedule */
    .schedule-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 32px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .schedule-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .upcoming-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .upcoming-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .up-time {
      font-size: 18px;
      font-weight: 800;
      color: #fbbf24;
    }
    .up-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .up-by {
      font-size: 13px;
      opacity: 0.75;
    }

    /* Selector Modal (For first-time kiosk setup) */
    .kiosk-setup {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .setup-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .setup-box h2 { margin-bottom: 12px; }
    .setup-box select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      font-size: 16px;
      margin: 18px 0;
      outline: none;
    }
    .setup-box button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #ff6a00;
      color: #fff;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .room-settings-btn {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,0,0,0.4);
      color: #94a3b8;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .kiosk-main { grid-template-columns: 1fr; overflow-y: auto; }
      body { height: auto; min-height: 100vh; overflow: auto; }
    }
  </style>
</head>
<body class="is-free">

  <!-- First Time Setup Overlay -->
  <div id="setupOverlay" class="kiosk-setup" style="display:none;">
    <div class="setup-box">
      <h2>📺 ตั้งค่าจอหน้าห้องประชุม</h2>
      <p style="color:#94a3b8; font-size:14px;">กรุณาเลือกห้องประชุมที่ต้องการให้แท็บเล็ตเครื่องนี้แสดงผล</p>
      <select id="setupRoomSelect">
        <option value="">กำลังโหลดรายการห้อง...</option>
      </select>
      <input type="password" id="setupKioskSecret" placeholder="Kiosk Secret (X-Kiosk-Secret)" style="width:100%; padding:14px; border-radius:12px; background:#0f172a; color:#fff; border:1px solid #475569; font-size:16px; margin-bottom:18px; outline:none; box-sizing:border-box;" />
      <button onclick="saveKioskRoom()">บันทึกและเริ่มแสดงผล</button>
    </div>
  </div>

  <header class="kiosk-header">
    <div class="room-title-area">
      <h1 id="kioskRoomName">🚪 กำลังโหลด...</h1>
      <div class="room-meta" id="kioskRoomMeta">-</div>
    </div>
    <div class="clock-area">
      <div class="clock-time" id="clockTime">--:--:--</div>
      <div class="clock-date" id="clockDate">--</div>
    </div>
  </header>

  <main class="kiosk-main">
    <!-- Status Card -->
    <div class="status-card">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="statusLabel">ว่าง (AVAILABLE)</span>
      </div>

      <div class="current-topic" id="currentTitle">พร้อมใช้งานทันที</div>
      <div class="current-host" id="currentHost">ไม่มีการประชุมในขณะนี้</div>
      <div class="current-timer" id="currentTimer">คุณสามารถเริ่มการประชุมได้ทันที</div>

      <!-- Quick Book Buttons -->
      <div class="quick-actions" id="quickActions">
        <div class="quick-title">⚡ จองใช้งานด่วนทันที:</div>
        <div class="quick-btns">
          <button class="btn-quick" onclick="quickBook(15)">+ 15 นาที</button>
          <button class="btn-quick" onclick="quickBook(30)">+ 30 นาที</button>
          <button class="btn-quick" onclick="quickBook(60)">+ 1 ชั่วโมง</button>
        </div>
      </div>
    </div>

    <!-- Upcoming Meetings -->
    <div class="schedule-card">
      <div class="schedule-title">
        <span>🗓️ การประชุมวันนี้</span>
        <span id="bookingCountBadge" style="font-size:14px; opacity:0.8;">0 รายการ</span>
      </div>
      <div class="upcoming-list" id="upcomingList">
        <div style="text-align:center; padding:40px; opacity:0.6;">ไม่มีรายการจองถัดไปในวันนี้</div>
      </div>
    </div>
  </main>

  <button class="room-settings-btn" onclick="openRoomSetup()">⚙️ เปลี่ยนห้องแสดงผล</button>

  <script>
    let currentRoomId = localStorage.getItem('kiosk_room_id');
    let allRooms = [];

    // Real-time Clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      const dateStr = `วัน${days[now.getDay()]}ที่ ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear() + 543}`;

      document.getElementById('clockTime').textContent = timeStr;
      document.getElementById('clockDate').textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Load Room and Display Data
    async function loadKioskData() {
      try {
        const res = await fetch('/api/rooms');
        allRooms = await res.json();

        if (!currentRoomId) {
          openRoomSetup();
          return;
        }

        const room = allRooms.find(r => String(r.id) === String(currentRoomId));
        if (!room) {
          openRoomSetup();
          return;
        }

        renderRoomDisplay(room);
      } catch (err) {
        console.error(err);
      }
    }

    function renderRoomDisplay(room) {
      document.getElementById('kioskRoomName').textContent = room.name;
      document.getElementById('kioskRoomMeta').textContent = `📍 ${room.location || ''} • 👥 ความจุ ${room.capacity} ท่าน`;

      const isBusy = room.is_busy;
      document.body.className = isBusy ? 'is-busy' : 'is-free';

      const statusLabel = document.getElementById('statusLabel');
      const currentTitle = document.getElementById('currentTitle');
      const currentHost = document.getElementById('currentHost');
      const currentTimer = document.getElementById('currentTimer');
      const quickActions = document.getElementById('quickActions');

      if (isBusy) {
        const b = room.current_booking;
        statusLabel.textContent = '🔴 กำลังใช้งาน (IN USE)';
        currentTitle.textContent = b.title;
        currentHost.textContent = `ผู้จอง: ${b.booked_by} ${b.department ? `(${b.department})` : ''}`;
        currentTimer.textContent = `สิ้นสุดเวลา ${b.end_at.slice(11, 16)} น.`;
        quickActions.style.display = 'none';
      } else {
        statusLabel.textContent = '🟢 ว่าง (AVAILABLE)';
        currentTitle.textContent = 'ห้องว่าง พร้อมให้ใช้งาน';
        currentHost.textContent = 'ไม่มีการประชุมอยู่ในขณะนี้';
        if (room.next_booking) {
          currentTimer.textContent = `ว่างจนถึง ${room.next_booking.start_at.slice(11, 16)} น. (จะเริ่ม: ${room.next_booking.title})`;
        } else {
          currentTimer.textContent = 'ว่างตลอดทั้งวัน';
        }
        quickActions.style.display = 'block';
      }

      // Fetch Today's upcoming bookings
      loadUpcomingBookings(room.id);
    }

    async function loadUpcomingBookings(roomId) {
      const now = new Date();
      const today = now.toISOString().slice(0, 10);
      const res = await fetch(`/api/bookings?room_id=${roomId}&date=${today}`);
      const bookings = await res.json();

      document.getElementById('bookingCountBadge').textContent = `${bookings.length} รายการวันนี้`;
      const listEl = document.getElementById('upcomingList');

      if (!bookings.length) {
        listEl.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.6;">ไม่มีรายการจองในวันนี้</div>';
        return;
      }

      listEl.innerHTML = bookings.map(b => `
        <div class="upcoming-item">
          <div>
            <div class="up-title">${b.title}</div>
            <div class="up-by">โดย: ${b.booked_by} ${b.department ? `• ${b.department}` : ''}</div>
          </div>
          <div class="up-time">${b.start_at.slice(11,16)} - ${b.end_at.slice(11,16)}</div>
        </div>
      `).join('');
    }

    // Quick Book Action
    async function quickBook(minutes) {
      if (!confirm(`ยืนยันการจองด่วน ${minutes} นาที สำหรับห้องนี้หรือไม่?`)) return;

      try {
        const kioskSecret = localStorage.getItem('kiosk_secret') || '';
        const headers = { 'Content-Type': 'application/json' };
        if (kioskSecret) {
          headers['x-kiosk-secret'] = kioskSecret;
        }

        const res = await fetch('/api/kiosk/quick-book', {
          method: 'POST',
          headers,
          body: JSON.stringify({
            room_id: currentRoomId,
            minutes: minutes,
            title: `การประชุมด่วน (${minutes} นาที)`,
            booked_by: 'ผู้ใช้หน้าห้องประชุม'
          })
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.message || 'ไม่สามารถจองได้');
          return;
        }

        alert(`✅ จองห้องสำเร็จเรียบร้อย (${minutes} นาที)`);
        await loadKioskData();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
      }
    }

    // Room Selection Setup
    function openRoomSetup() {
      const select = document.getElementById('setupRoomSelect');
      select.innerHTML = allRooms.map(r => `
        <option value="${r.id}" ${String(r.id) === String(currentRoomId) ? 'selected' : ''}>
          ${r.name} (${r.location})
        </option>
      `).join('');
      const secretInput = document.getElementById('setupKioskSecret');
      if (secretInput) {
        secretInput.value = localStorage.getItem('kiosk_secret') || '';
      }
      document.getElementById('setupOverlay').style.display = 'flex';
    }

    function saveKioskRoom() {
      const selected = document.getElementById('setupRoomSelect').value;
      if (!selected) return;
      currentRoomId = selected;
      localStorage.setItem('kiosk_room_id', selected);
      const secretInput = document.getElementById('setupKioskSecret');
      if (secretInput) {
        localStorage.setItem('kiosk_secret', secretInput.value.trim());
      }
      document.getElementById('setupOverlay').style.display = 'none';
      loadKioskData();
    }

    // Auto refresh every 15 seconds
    setInterval(loadKioskData, 15000);
    loadKioskData();
  </script>
</body>
</html>
