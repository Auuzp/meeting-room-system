<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ย้ายฐานข้อมูลเสร็จแล้ว</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #eef2ff; }
    main { width: min(92vw, 520px); box-sizing: border-box; padding: 28px; border: 1px solid #303747; border-radius: 16px; background: #191e2a; }
    h1 { margin: 0 0 10px; font-size: 1.4rem; }
    p { color: #bbc4d7; line-height: 1.6; }
    .actions { display: grid; gap: 10px; margin-top: 22px; }
    a { display: block; padding: 14px; border-radius: 10px; text-align: center; color: white; text-decoration: none; font-weight: 700; }
    .primary { background: #4f7df3; }
    .secondary { border: 1px solid #424b60; background: #111622; }
  </style>
</head>
<body>
  <main>
    <h1>ย้ายฐานข้อมูลเสร็จแล้ว</h1>
    <p>ระบบใช้ฐานข้อมูล Neon เรียบร้อยแล้ว หน้านี้มีไว้สำหรับคัดลอกข้อมูลเพียงครั้งเดียวและปิดการใช้งานหลังย้ายเสร็จ</p>
    <p>หากต้องการจัดการห้องประชุมหรือรายชื่อพนักงาน ให้เข้าสู่หน้า Admin ด้วยรหัส Admin PIN เดิมของระบบ</p>
    <div class="actions">
      <a class="primary" href="/admin.html">เข้าสู่หน้า Admin</a>
      <a class="secondary" href="/">กลับหน้าหลัก</a>
    </div>
  </main>
</body>
</html>
