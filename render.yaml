services:
  - type: web
    name: meeting-room-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: KIOSK_SECRET
        sync: false
      - key: DB_PATH
        value: ./data/meeting_rooms.db
    disk:
      name: meeting-room-data
      mountPath: /app/data
      sizeGB: 1
